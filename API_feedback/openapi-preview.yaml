  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: |
        ✅ **Shipped (preview-v13).** Projects of organizations trusted by the key's providers.
        Sort by `id`, `name`.
      operationId: listProjects
      security: [{ ApiKey: [users:read] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: 'filter[external_reference]'
          in: query
          schema: { type: string, maxLength: 35 }
        - name: 'filter[name]'
          in: query
          schema: { type: string, description: 'eq | contains | starts_with' }
        - name: 'filter[status]'
          in: query
          schema: { type: string, enum: [active, on_hold, inactive, published] }
        - name: 'filter[organization_id]'
          in: query
          schema: { type: integer }
        - name: 'filter[group_id]'
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/CollectionEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Project' } } } }] } } } }
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        ✅ **Shipped (preview-v13; proposed in preview-v8 from integrator feedback).** Lets an external proposal system
        create the OpenIRIS project once a proposal is granted. `organization_id` may be omitted when
        `group_id` is given (it is derived from the group); both must belong to an organization the
        key's providers trust. Members are given **by email**, resolved against *visible* users, and
        resolved against existing users; emails with no matching user are returned in
        `unmatched_emails` for manual handling. The API deliberately does **not** auto-create user
        accounts (duplicate-account and SSO-mismatch risk) — an invitation flow is a candidate for
        a later version.
      operationId: createProject
      security: [{ ApiKey: [projects:write] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Project'
                  - type: object
                    properties:
                      unmatched_emails:
                        type: array
                        items: { type: string, format: email }
                        description: Member emails that matched no existing user — resolve manually.
        '409':
          description: A project with this external_reference already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      security: [{ ApiKey: [users:read] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
