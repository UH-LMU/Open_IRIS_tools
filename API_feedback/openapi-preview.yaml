  # ─────────────────────────────────────────────────────────────────────────
  # COST CENTERS / PRICES / QUOTES / ORDERS — stubbed
  # ─────────────────────────────────────────────────────────────────────────

  /cost-centers:
    get:
      tags: [Cost centers]
      operationId: listCostCenters
      security: [{ ApiKey: [billing:read] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: 'filter[status]'
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: 'filter[code]'
          in: query
          schema: { type: string, maxLength: 10, description: Exact-match lookup — the diff key for nightly ERP sync jobs (new in preview-v8) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CostCenterAccount' } }
    post:
      tags: [Cost centers]
      summary: Create a cost center
      description: |
        **Target v1 (preview-v8, from integrator feedback).** Enables automatic sync of valid
        billing codes (SAP WBS elements, cost centers) from the institutional ERP — no more manual
        entry and manual inactivation. `code` is unique per provider, ≤10 alphanumeric (SAP cost
        center length limit, enforced on write). Sync recipe: `GET ?filter[code]=` → `POST` on
        miss, `PATCH` status on validity change.
      operationId: createCostCenter
      security: [{ ApiKey: [cost-centers:write] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 10, pattern: '^[A-Za-z0-9]+$' }
                name: { type: string, maxLength: 200 }
                remit_code: { type: string, nullable: true }
                billing_address: { type: string, nullable: true }
                provider_id: { type: integer, description: Required when the key resolves to multiple providers }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCenterAccount' }
        '409':
          description: Code already exists for this provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /cost-centers/{id}:
    get:
      tags: [Cost centers]
      operationId: getCostCenter
      security: [{ ApiKey: [billing:read] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses: { '200': { description: OK } }
    patch:
      tags: [Cost centers]
      summary: Update a cost center (incl. inactivation)
      description: |
        **Target v1 (preview-v8).** Inactivation (`status: inactive`) stops the code being
        selectable for **new** bookings/charges; existing charges keep referencing it — cost
        centers are never deleted. Reactivation is allowed.
      operationId: patchCostCenter
      security: [{ ApiKey: [cost-centers:write] }]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                status: { type: string, enum: [active, inactive] }
                remit_code: { type: string, nullable: true }
                billing_address: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCenterAccount' }
        '412': { description: If-Match precondition failed }

