      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, nullable: true }
                  level: { type: string, enum: [info, warning, critical], nullable: true }
                  expires_at: { type: string, format: date-time, nullable: true }

# ════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer oi_live_{key_id}_{secret}` (or `oi_test_…` for sandbox).
        Keys carry scopes and are bound to a resolved set of providers (explicit grants +
        organization convenience grants; see proposal §2).

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor. Use `links.next` from the previous response.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: |
        Comma-separated field list. Prefix `-` for descending. Example: `-created_at,name`.
        Allowed fields are endpoint-specific; unknown fields return 400.
    Fields:
      name: fields
      in: query
      schema: { type: string }
      description: |
        Sparse fieldsets, type-scoped: `fields[booking]=id,start,end&fields[charge]=amount`.
        Reduces payload size.
    Expand:
      name: expand
      in: query
      schema: { type: string }
      description: |
        Comma-separated list of relations to expand inline. Result nests expanded objects as
        `embeds.{relation}.data`. Example: `expand=resource,user`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 64 }
      description: |
        Required on all `POST`, `PATCH`, and non-cancel `DELETE`. Responses cached 24 h per
        `(api_key_id, key)` pair. Re-posting with the same key and same body returns the cached
        response; different body returns 422.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: Required on `PATCH`. Value is the `ETag` from the last GET. Mismatch returns 412.
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PathIdStr:
      name: id
      in: path
      required: true
      schema: { type: string }

  headers:
    ETag:
      schema: { type: string }
      description: Opaque version tag. Send back as `If-Match` on the next PATCH.
    XTotalRecords:
      schema: { type: integer }
      description: Total items across all pages in the current filter.
    RateLimitLimit:
      schema: { type: integer }
      description: Requests allowed in the current window.
    RateLimitRemaining:
      schema: { type: integer }
      description: Requests remaining in the current window. Only accurate on 429 in preview-v7.
    RateLimitReset:
      schema: { type: integer }
      description: Seconds until the current rate-limit window resets.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://docs.openiris.io/errors/401
            title: Unauthorized
            status: 401
            code: unauthorized
            detail: API key is missing, revoked, or expired.
            trace_id: 4db8e9a...
    Forbidden:
      description: Scope insufficient or resource out of tenant scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: State conflict (e.g. booking overlap)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unprocessable:
      description: Validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:

    # ── Envelopes & common ──────────────────────────────────────────────────

    CollectionEnvelope:
      type: object
      description: Shape of every collection response.
      properties:
        meta:
          type: object
          properties:
            total: { type: integer }
            cursor_next: { type: string, nullable: true }
            cursor_prev: { type: string, nullable: true }
        links:
          type: object
          properties:
            self: { type: string, format: uri }
            next: { type: string, format: uri, nullable: true }
            prev: { type: string, format: uri, nullable: true }
            first: { type: string, format: uri }
            last: { type: string, format: uri }

    ResourceLinks:
      type: object
      properties:
        self: { type: string, format: uri }
        html: { type: string, format: uri, description: Deep link into the OpenIRIS admin UI }

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, unprocessable, rate_limited, internal_error]
        trace_id: { type: string }
        data: { type: object, additionalProperties: true }

    # ── Ping ────────────────────────────────────────────────────────────────

    PingResponse:
      type: object
      required: [status, provider_ids, scopes, server_time]
      properties:
        status: { type: string, example: ok }
        provider_ids: { type: array, items: { type: integer } }
        scopes: { type: array, items: { type: string } }
        server_time: { type: string, format: date-time }

    # ── Charges ─────────────────────────────────────────────────────────────

    ChargeSource:
      type: string
      enum: [booking, request, product]
      description: Which of the three polymorphic DB tables this charge originated from.

    CostCenter:
      type: object
      description: |
        The collapsed cost-center assignment embedded on a charge (shipped preview-v13; the same
        shape is proposed for bookings and requests). Resolved from the booking or request the
        charge came from — the charge tables carry no cost-center column. Null on the charge when
        nothing is assigned. Not the standalone /cost-centers entity — see CostCenterAccount.
      properties:
        provider_cost_center_id: { type: integer, nullable: true, description: 'Id in /cost-centers' }
        provider_code:
          type: string
          nullable: true
          description: ERP-posting code (SAP WBS / cost center, Oracle Code Block) — the provider cost center's code.
        provider_name: { type: string, nullable: true }
        group_code: { type: string, nullable: true, description: 'Group-level cost center code, when the booking or request carries one' }
        organization_code: { type: string, nullable: true }
        user_code: { type: string, nullable: true }

    CostCenterAccount:
      type: object
      description: The standalone provider cost-center entity served by /cost-centers (writable since preview-v8).
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 10, description: Unique per provider; ≤10 alphanumeric (SAP limit) }
        name: { type: string }
        remit_code: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        billing_address: { type: string, nullable: true }
        is_default: { type: boolean }
        provider_id: { type: integer }
        created_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    Charge:
      type: object
      required: [id, source, provider_id, user_id, currency, total, status, created_at, links]
      properties:
        id: { type: integer }
        source: { $ref: '#/components/schemas/ChargeSource' }
        source_id: { type: integer }
        booking_id: { type: integer, nullable: true }
        request_id: { type: integer, nullable: true }
        provider_id: { type: integer }
        user_id: { type: integer }
        group_id: { type: integer, nullable: true }
        project_id: { type: integer, nullable: true }
        cost_center: { $ref: '#/components/schemas/CostCenter' }
        currency: { type: string, example: EUR, description: ISO 4217 code }
        total: { type: number }
        discount_percent: { type: number, nullable: true }
        rebate_amount: { type: number, nullable: true }
        tax_amount: { type: number, nullable: true }
        tax_rate: { type: number, nullable: true }
        tax_code: { type: string, maxLength: 10, nullable: true }
        is_waived: { type: boolean }
        invoice_id: { type: integer, nullable: true }
        invoice_date: { type: string, format: date-time, nullable: true }
        invoice_date_local: { type: string, format: date-time, nullable: true, description: Local-time mirror; use this for SAP PostingDate to avoid wrong-period posting }
        status: { type: string, enum: [unbilled, invoiced, exported, waived, cancelled] }
        confirmed_at: { type: string, format: date-time, nullable: true, description: 'When a billing admin signed this charge off as ready to bill. Independent of status — it survives invoicing and export.' }
        period_start: { type: string, format: date-time }
        period_start_local: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        period_end_local: { type: string, format: date-time }
        external_reference:
          type: string
          maxLength: 35
          nullable: true
          description: Integrator-populated, round-tripped. Sized for SAP DocumentReferenceID.
        external_account_assignment:
          type: object
          additionalProperties: true
          description: Passthrough for ERP mapping (WBS element, Oracle Code Block overrides, etc.)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true, description: 'Currently NULL on ~75% of rows — see proposal §9 P0' }
        recalculated_at: { type: string, format: date-time, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    ChargeConfirmation:
      type: object
      description: |
        One billing-admin sign-off. A charge has at most one; withdrawing deletes it.
      properties:
        charge_id: { type: integer }
        confirmed_at: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ChargeLineItem:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date-time }
        amount: { type: number }
        quantity: { type: number, nullable: true }
        price_item_code: { type: string, nullable: true }
        price_value: { type: number, nullable: true }
        currency: { type: string, example: EUR }
        off_hours: { type: boolean }
        is_training: { type: boolean }
        summary: { type: string, nullable: true }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
        order_number: { type: integer, description: Proposed - not yet served. }
        tax_amount: { type: number, nullable: true }
        tax_rate: { type: number, nullable: true }
        tax_code: { type: string, nullable: true }

    ChargeExport:
      type: object
      properties:
        id: { type: integer }
        external_id: { type: string }
        external_system: { type: string }
        exported_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        exported_by_key_id: { type: string, description: Proposed - not yet served. }
        notes: { type: string, nullable: true }

    # ── Invoices ────────────────────────────────────────────────────────────

    Invoice:
      type: object
      description: |
        preview-v8 correction: the singular `cost_center` field was removed — an invoice may span
        many cost centers (institutions invoice all groups quarterly in one document). Per-cost-
        center breakdown comes from grouping `/invoices/{id}/charges` by `cost_center`.
      properties:
        id: { type: integer }
        display_id: { type: integer, nullable: true }
        provider_id: { type: integer }
        user_id: { type: integer }
        cost_center_count: { type: integer, description: Distinct cost centers across the invoice's charges }
        currency: { type: string, example: EUR }
        subtotal: { type: number }
        tax_total: { type: number }
        total: { type: number }
        status: { type: string, enum: [draft, sent, paid, void] }
        issued_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        charge_count: { type: integer }
        external_reference: { type: string, maxLength: 35, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    InvoicePatch:
      type: object
      properties:
        status: { type: string, enum: [draft, sent, paid, void] }
        due_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        external_reference: { type: string, maxLength: 35, nullable: true }

    # ── Bookings ────────────────────────────────────────────────────────────

    BookingStatus:
      type: string
      enum: [confirmed, pending_approval, rejected, cancelled, completed]
      description: |
        Derived server-side (no backing column). See proposal Appendix A. Filtering by status
        translates to explicit SQL predicates — mapping is stable across versions.

    Booking:
      type: object
      required: [id, guid, start, end, status, resource_id, user_id, links]
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        title: { type: string, nullable: true }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/BookingStatus' }
        kind: { type: string, enum: [booking, usage], description: 'usage = recorded after the fact through the Public API (preview-v13)' }
        resource_id: { type: integer }
        provider_id: { type: integer, description: 'Inherited from the resource (preview-v13)' }
        user_id: { type: integer }
        group_id: { type: integer, nullable: true }
        project_id: { type: integer, nullable: true }
        request_id: { type: integer, nullable: true }
        series_id: { type: integer, nullable: true }
        operator_id: { type: integer, nullable: true }
        operator_assisted: { type: boolean }
        approval_status: { type: string, nullable: true, enum: [approved, pending, rejected, null], description: 'NULL means no approval required (not pending)' }
        parent_booking_id: { type: integer, nullable: true, description: 'Set on add-on rows (preview-v13)' }
        is_cancelled: { type: boolean }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cost_center: { $ref: '#/components/schemas/CostCenter' }
        comments: { type: string, nullable: true }
        location: { type: string, nullable: true }
        charge_purged: { type: boolean }
        external_reference: { type: string, maxLength: 35, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        current_caller_can_cancel: { type: boolean }
        current_caller_can_edit: { type: boolean }
        current_caller_can_approve: { type: boolean }
        current_caller_can_reject: { type: boolean }
        current_caller_can_view_charges: { type: boolean }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    BookingCreate:
      type: object
      required: [kind, resource_id, user_id, start, end]
      properties:
        kind: { type: string, enum: [usage, booking], description: 'usage (shipped): a completed measurement, entirely in the past. booking (next increment): a reservation in advance.' }
        resource_id: { type: integer }
        user_id: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        title: { type: string }
        group_id: { type: integer }
        project_id: { type: integer }
        operator_id: { type: integer }
        comments: { type: string }
        external_reference: { type: string, maxLength: 35 }

    BookingPatch:
      type: object
      description: The integrator-owned fields (preview-v13). Times, users and resources are not editable through the Public API.
      properties:
        external_reference: { type: string, maxLength: 35, description: 'Empty string clears it' }
        comments: { type: string, maxLength: 4000 }

    CurrentBooking:
      type: object
      description: Door-access answer from GET /resources/{id}/current-booking (preview-v13).
      required: [resource_id, user_id, at, access]
      properties:
        resource_id: { type: integer }
        user_id: { type: integer }
        at: { type: string, format: date-time }
        access: { type: boolean }
        via: { type: string, nullable: true, enum: [user, group, null], description: 'How the user matched; null when access is false' }
        booking: { allOf: [{ $ref: '#/components/schemas/Booking' }], nullable: true }

    BookingSeries:
      type: object
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        title: { type: string, nullable: true }
        mode: { type: string, enum: [daily, weekly, monthly] }
        interval: { type: integer, nullable: true }
        by_days: { type: array, items: { type: string } }
        ending_type: { type: string, enum: [never, count, until], nullable: true }
        end_count: { type: integer, nullable: true }
        end_until: { type: string, format: date-time, nullable: true }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        resource_id: { type: integer }
        user_id: { type: integer }
        is_cancelled: { type: boolean }
        canceled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    BookingSeriesCreate:
      type: object
      required: [resource_id, user_id, start, end, mode]
      properties:
        resource_id: { type: integer }
        user_id: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        title: { type: string }
        mode: { type: string, enum: [daily, weekly, monthly] }
        interval: { type: integer }
        by_days: { type: array, items: { type: string } }
        ending_type: { type: string, enum: [never, count, until] }
        end_count: { type: integer }
        end_until: { type: string, format: date-time }
        completion_webhook_url: { type: string, format: uri }

    # ── Resources ───────────────────────────────────────────────────────────

    ResourceClass:
      type: string
      # preview-v9 correction: the REAL domain classes (the earlier
      # equipment|service|facility enum was aspirational and wrong).
      enum: [scheduled, application, service, scheduled_addon, event]

    Resource:
      type: object
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        class: { $ref: '#/components/schemas/ResourceClass' }
        status: { type: string, enum: [active, inactive, archived], description: 'inactive = not bookable (offline, or provisioned and not yet configured); archived = terminal, set via /transitions' }
        provider_id: { type: integer }
        resource_type_id: { type: integer }
        location: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        model_number: { type: string, nullable: true }
        serial_number: { type: string, nullable: true }
        rfid: { type: string, nullable: true }
        concurrent_booking_enabled: { type: boolean }
        request_based_booking_enabled: { type: boolean }
        timezone: { type: string, example: Europe/Berlin, description: Resolved from the parent Provider }
        gl_account_hint: { type: string, nullable: true, description: Admin-set GL account code for ERP mapping (pass-through) }
        external_reference: { type: string, maxLength: 35, nullable: true, description: 'Asset-management mapping key; unique per provider (new in preview-v8)' }
        created_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true, description: 'Set by the archive transition (preview-v13)' }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    ResourceProvision:
      type: object
      description: Master-data-only create body for POST /resources (shipped preview-v13). Everything else is configured in the OpenIRIS UI.
      required: [name, external_reference, resource_type_id]
      properties:
        name: { type: string, maxLength: 400 }
        provider_id: { type: integer, description: 'May be omitted when the key resolves to exactly one provider' }
        resource_type_id: { type: integer, description: 'Required — resolve via GET /resource-types' }
        class: { $ref: '#/components/schemas/ResourceClass' }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        model_number: { type: string, nullable: true }
        serial_number: { type: string, nullable: true }
        external_reference: { type: string, maxLength: 35, description: Unique per provider — the asset-system mapping key }

    Provider:
      type: object
      description: A facility (core) the key is scoped to (preview-v13).
      required: [id, guid, name]
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        name: { type: string }
        short_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        url: { type: string, nullable: true }
        location: { type: string, nullable: true }
        contacts: { type: string, nullable: true }
        usage_policy_url: { type: string, nullable: true }
        is_billing_enabled: { type: boolean }
        timezone: { type: string, nullable: true, example: Europe/Berlin, description: IANA zone; resources inherit it }
        currency: { type: string, nullable: true, example: EUR, description: ISO 4217 }
        created_at: { type: string, format: date-time, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    ResourceType:
      type: object
      description: A resource type in use by the key's providers, or a parent of one (preview-v13).
      required: [id, guid, name, status]
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        parent_id: { type: integer, nullable: true, description: null on a top-level type }
        status: { type: string, enum: [active, inactive] }
        is_public: { type: boolean }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    # ── Requests ────────────────────────────────────────────────────────────

    Request:
      type: object
      properties:
        id: { type: integer }
        guid: { type: string, format: uuid }
        name: { type: string }
        alt_id: { type: string, nullable: true }
        service_id: { type: integer, description: FK to Resource }
        provider_id: { type: integer, description: "Owning provider, inherited from the service" }
        status:
          type: string
          enum: [pending, active, rejected, closed, inactive, reviewed, discontinued]
          description: The stored request lifecycle state.
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }
        user_id: { type: integer }
        group_id: { type: integer, nullable: true }
        project_id: { type: integer, nullable: true }
        budget: { type: number, nullable: true }
        actual_budget: { type: number, nullable: true }
        cost_center: { $ref: '#/components/schemas/CostCenter' }
        external_reference: { type: string, maxLength: 35, nullable: true }
        created_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    Group:
      type: object
      description: >-
        A group the key can see: one belonging to an organization trusted by the
        key's resolved providers.
      required: [id, name, organization_id]
      properties:
        id: { type: integer }
        name: { type: string }
        short_name: { type: string, nullable: true }
        organization_id: { type: integer }
        contact_email: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    GroupMember:
      type: object
      description: >-
        One group membership. Membership drives access and billing attribution;
        changing it never retro-affects existing bookings or charges.
      required: [user_id, group_id, status, joined_on]
      properties:
        user_id: { type: integer }
        group_id: { type: integer }
        status:
          type: string
          enum: [active, pending, disabled, blocked]
          description: >-
            Legacy semantics: the stored "closed" state is the ACTIVE one and is
            served as `active`.
        joined_on: { type: string, format: date-time }

    RequestParticipant:
      type: object
      required: [user_id, request_id, role, email, organization_id, added_at]
      properties:
        user_id: { type: integer }
        request_id: { type: integer }
        role:
          type: string
          enum: [owner, participant]
          description: The owner is the submitter and is always returned first.
        status:
          type: string
          enum: [pending, approved, rejected, inactive]
          nullable: true
          description: |
            Null for an owner with no participant row of their own, and for rows
            that predate the status column. Access does not depend on it.
        email: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        organization_id: { type: integer }
        added_at:
          type: string
          format: date-time
          description: Falls back to the request creation date for rows that predate the column.
        added_by_user_id: { type: integer, nullable: true }

    RequestCreate:
      type: object
      description: >-
        Create body for POST /requests (proposed). `type` is parked with the
        training-request union - the shipped read surface has no type field.
      required: [name, service_id, user_id, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [service, training] }
        service_id: { type: integer }
        user_id: { type: integer }
        group_id: { type: integer }
        project_id: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        budget: { type: number }
        external_reference: { type: string, maxLength: 35 }

    RequestPatch:
      type: object
      properties:
        name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        budget: { type: number }
        actual_budget: { type: number }
        external_reference: { type: string, maxLength: 35 }

    # ── Attachments, Forms, other ──────────────────────────────────────────

    Attachment:
      type: object
      required: [id, file_name, sha256, size_bytes, immutable, created_at]
      properties:
        id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string, nullable: true }
        size_bytes: { type: integer }
        sha256: { type: string, description: SHA-256 hex of the content — integrators verify after download }
        immutable: { type: boolean, description: True once a referencing charge reaches status=exported }
        created_at: { type: string, format: date-time }
        uploaded_by_user_id: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        links:
          type: object
          properties:
            self: { type: string, format: uri }
            content: { type: string, format: uri }

    FormFieldType:
      type: string
      enum: [text, number, boolean, date, select, multiselect, attachment, url, user_ref, resource_ref, booking_ref, request_ref]

    FormField:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/FormFieldType' }
        required: { type: boolean }
        validation:
          type: object
          properties:
            min: { type: number, nullable: true }
            max: { type: number, nullable: true }
            pattern: { type: string, nullable: true }
            options: { type: array, items: { type: string } }

    Form:
      type: object
      properties:
        id: { type: integer }
        provider_id: { type: integer }
        resource_id: { type: integer }
        title: { type: string }
        is_required: { type: boolean }
        comment: { type: string, nullable: true }
        fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
        version: { type: string }

    FormSubmission:
      type: object
      properties:
        id: { type: integer }
        form_id: { type: integer }
        booking_id: { type: integer, nullable: true }
        request_id: { type: integer, nullable: true }
        user_id: { type: integer }
        submission_date: { type: string, format: date-time }
        form_schema_version: { type: string }
        data:
          type: object
          description: Typed key-value pairs per the form's field schema.
          additionalProperties: true

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        orcid: { type: string, nullable: true }
        is_verified: { type: boolean }
        is_disabled: { type: boolean }
        organization_id: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    Project:
      type: object
      description: An organization-owned project with direct members (shipped preview-v13). Members are read from GET /projects/{id}/members.
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        short_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, on_hold, inactive, published] }
        organization_id: { type: integer, nullable: true }
        group_id: { type: integer, nullable: true }
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }
        external_reference: { type: string, maxLength: 35, nullable: true, description: 'Proposal-system mapping key; unique within the organization (corrected in preview-v13 — projects are organization-owned)' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    ProjectMember:
      type: object
      description: One direct membership or admin row, identity inlined (preview-v13).
      required: [user_id, project_id, role, email]
      properties:
        user_id: { type: integer }
        project_id: { type: integer }
        role: { type: string, enum: [member, admin] }
        status: { type: string, nullable: true, enum: [active, pending, disabled, blocked, null], description: null for an admin without a member row }
        email: { type: string, format: email }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        organization_id: { type: integer }
        joined_on: { type: string, format: date-time, nullable: true }

    ProjectCreate:
      type: object
      description: Create body for POST /projects (shipped preview-v13). organization_id may be omitted when group_id is given.
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        short_name: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 200, nullable: true }
        group_id: { type: integer, nullable: true }
        organization_id: { type: integer, nullable: true }
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }
        member_emails:
          type: array
          items: { type: string, format: email }
          description: Resolved against existing users; no accounts are auto-created — misses come back in `unmatched_emails`.
        external_reference: { type: string, maxLength: 35, nullable: true }

    # ── Webhooks ────────────────────────────────────────────────────────────

    Webhook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_delivered_at: { type: string, format: date-time, nullable: true }
        recent_failure_count: { type: integer }

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events: { type: array, items: { type: string }, example: [charge.exported, booking.cancelled] }
        description: { type: string }
        secret_rotation: { type: string, enum: [none, monthly, quarterly], default: none }

    WebhookPatch:
      type: object
      properties:
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        description: { type: string }
        is_active: { type: boolean }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: integer }
        event: { type: string }
        attempted_at: { type: string, format: date-time }
        response_status: { type: integer, nullable: true }
        response_body_excerpt: { type: string, nullable: true }
        succeeded: { type: boolean }
        attempt_number: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }

    EventCatalogEntry:
      type: object
      properties:
        name: { type: string, example: charge.exported }
        description: { type: string }
        payload_schema_url: { type: string, format: uri }

    # ── Async tasks ─────────────────────────────────────────────────────────

    Task:
      type: object
      properties:
        id: { type: string, example: tsk_abc123 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100, nullable: true }
        result_url: { type: string, format: uri, nullable: true }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

