        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
      responses:
        '201': { description: Added (200 if already a member) }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/members/{user_id}:
    delete:
      tags: [Projects]
      summary: Remove a member from a project
      description: '✅ **Shipped (preview-v13).** Idempotent — 204 whether or not the row existed.'
